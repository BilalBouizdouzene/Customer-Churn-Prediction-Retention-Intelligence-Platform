[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-churn-retention-intelligence"
version = "0.1.0"
description = "Leakage-safe customer churn prediction and retention decision support platform."
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1,<3",
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
  "xgboost>=2.0,<4",
  "shap>=0.45,<1",
  "Flask>=3.0,<4",
  "joblib>=1.3,<2",
  "PyYAML>=6.0,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E402", "E501"]
